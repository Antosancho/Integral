<!-- @dsCard group="Formularios" height=460 subtitle="Selector con alta en el momento (Categoría / Proveedor)" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Picker — Integral</title>
<style>body{padding:20px;background:var(--bg)} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .col{display:grid;gap:16px} .cap{font:500 12px/16px var(--font-sans);color:var(--ink-subtle);margin-bottom:6px} </style></head>
<body>

<div class="row" style="align-items:flex-start;gap:24px">
 <div class="col" style="width:300px">
  <div class="ig-field"><label class="ig-label">Categoría <span class="req">*</span></label><button class="ig-picker"><span>Almacén</span><svg class="ig-icon ig-icon-sm" aria-hidden="true"
 
  xmlns="http://www.w3.org/2000/svg"
 
 
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m7 15 5 5 5-5" />
  <path d="m7 9 5-5 5 5" />
</svg></button></div>
  <div class="ig-field"><label class="ig-label">Proveedor <span class="req">*</span></label><button class="ig-picker is-focus"><span class="placeholder">Elegí o creá un proveedor</span><svg class="ig-icon ig-icon-sm" aria-hidden="true"
 
  xmlns="http://www.w3.org/2000/svg"
 
 
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m7 15 5 5 5-5" />
  <path d="m7 9 5-5 5 5" />
</svg></button></div>
 </div>
 <div class="ig-picker-pop" role="dialog" aria-label="Elegir proveedor">
  <div class="ig-pop-search"><div class="ig-input-wrap"><svg class="ig-icon" aria-hidden="true"
 
  xmlns="http://www.w3.org/2000/svg"
 
 
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="11" cy="11" r="8" />
  <path d="m21 21-4.3-4.3" />
</svg><input class="ig-input is-focus" value="dist"></div></div>
  <ul class="ig-picker-list" role="listbox">
   <li class="is-active" role="option"><svg class="ig-icon ig-icon-sm" aria-hidden="true"
 
  xmlns="http://www.w3.org/2000/svg"
 
 
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" />
  <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" />
  <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2" />
  <path d="M10 6h4" />
  <path d="M10 10h4" />
  <path d="M10 14h4" />
  <path d="M10 18h4" />
</svg><span><b>Dist</b>ribuidora Sur</span><span class="meta">14 productos</span></li>
   <li role="option"><svg class="ig-icon ig-icon-sm" aria-hidden="true"
 
  xmlns="http://www.w3.org/2000/svg"
 
 
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" />
  <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" />
  <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2" />
  <path d="M10 6h4" />
  <path d="M10 10h4" />
  <path d="M10 14h4" />
  <path d="M10 18h4" />
</svg><span><b>Dist</b>ribuidora Norte</span><span class="meta">3 productos</span></li>
  </ul>
  <div class="ig-picker-new">
   <div class="ig-overline">Nuevo proveedor</div>
   <div class="ig-field"><label class="ig-label">Nombre <span class="req">*</span></label><input class="ig-input" value="Distribuidora Oeste"></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="ig-field"><label class="ig-label">Teléfono</label><input class="ig-input" placeholder="Opcional"></div><div class="ig-field"><label class="ig-label">Notas</label><input class="ig-input" placeholder="Opcional"></div></div>
   <div class="row" style="justify-content:flex-end"><button class="ig-btn ig-btn-ghost ig-btn-sm">Cancelar</button><button class="ig-btn ig-btn-primary ig-btn-sm">Crear y elegir</button></div>
  </div>
 </div>
</div>
</body>
</html>
