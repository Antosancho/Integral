<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Modal — Integral</title>
<style>body{margin:0}</style></head>
<body>

<div class="ig-overlay is-inline"><div class="ig-modal ig-modal-sm" role="dialog" aria-modal="true" aria-labelledby="t">
 <div class="ig-modal-head"><div><h2 id="t">Título del modal</h2><p>Bajada opcional en una línea.</p></div><button class="ig-btn ig-btn-ghost ig-btn-sm ig-btn-icon" aria-label="Cerrar"><svg class="ig-icon" aria-hidden="true"
 
  xmlns="http://www.w3.org/2000/svg"
 
 
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M18 6 6 18" />
  <path d="m6 6 12 12" />
</svg></button></div>
 <div class="ig-modal-body"><p style="margin:0">Contenido: formulario, tabla o mensaje. El primer campo recibe el foco al abrir.</p></div>
 <div class="ig-modal-foot"><div class="ig-shortcuts"><span><kbd class="ig-kbd">Esc</kbd> Cancelar</span><span><kbd class="ig-kbd">Enter</kbd> Confirmar</span></div><button class="ig-btn ig-btn-ghost">Cancelar</button><button class="ig-btn ig-btn-primary">Confirmar</button></div>
</div></div>
</body>
</html>
