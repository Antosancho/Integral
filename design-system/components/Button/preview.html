<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Button — Integral</title>
<style>body{padding:20px;background:var(--bg)} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .col{display:grid;gap:16px} .cap{font:500 12px/16px var(--font-sans);color:var(--ink-subtle);margin-bottom:6px} </style></head>
<body>

<div class="col">
 <div><div class="cap">Variantes (md 40px)</div><div class="row">
  <button class="ig-btn ig-btn-primary"><svg class="ig-icon" aria-hidden="true"
 
  xmlns="http://www.w3.org/2000/svg"
 
 
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M5 12h14" />
  <path d="M12 5v14" />
</svg>Nuevo producto</button>
  <button class="ig-btn ig-btn-secondary"><svg class="ig-icon" aria-hidden="true"
 
  xmlns="http://www.w3.org/2000/svg"
 
 
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M16 16h6" />
  <path d="M19 13v6" />
  <path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14" />
  <path d="m7.5 4.27 9 5.15" />
  <polyline points="3.29 7 12 12 20.71 7" />
  <line x1="12" x2="12" y1="22" y2="12" />
</svg>Cargar stock</button>
  <button class="ig-btn ig-btn-ghost">Cancelar</button>
  <button class="ig-btn ig-btn-edit ig-btn-sm"><svg class="ig-icon ig-icon-sm" aria-hidden="true"
 
  xmlns="http://www.w3.org/2000/svg"
 
 
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
  <path d="m15 5 4 4" />
</svg>Editar</button>
  <button class="ig-btn ig-btn-danger">Eliminar</button>
  <button class="ig-btn ig-btn-ghost ig-btn-sm ig-btn-icon" aria-label="Quitar línea"><svg class="ig-icon" aria-hidden="true"
 
  xmlns="http://www.w3.org/2000/svg"
 
 
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M18 6 6 18" />
  <path d="m6 6 12 12" />
</svg></button>
 </div></div>
 <div><div class="cap">Estados: foco por teclado · deshabilitado · con atajo</div><div class="row">
  <button class="ig-btn ig-btn-primary is-focus">Guardar producto</button>
  <button class="ig-btn ig-btn-secondary is-focus">Volver</button>
  <button class="ig-btn ig-btn-primary" disabled>Guardar producto</button>
  <button class="ig-btn ig-btn-secondary">Buscar <kbd class="ig-kbd">F2</kbd></button>
 </div></div>
 <div style="max-width:420px"><div class="cap">xl 64px — solo APROBAR VENTA</div>
  <button class="ig-btn ig-btn-primary ig-btn-xl"><svg class="ig-icon ig-icon-lg" aria-hidden="true"
 
  xmlns="http://www.w3.org/2000/svg"
 
 
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 6 9 17l-5-5" />
</svg>APROBAR VENTA</button></div>
</div>
</body>
</html>
