<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integral — Logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ── A: Symbol alone on dark ── */
const IconA = () => (
  <div style={{
    width: '100%', height: '100%',
    background: '#0a0f1e',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
  }}>
    <span style={{
      fontFamily: "'DM Serif Display', serif",
      fontStyle: 'italic',
      fontSize: 120,
      color: '#4f80ff',
      lineHeight: 1,
    }}>∫</span>
  </div>
);

/* ── B: Symbol alone on white ── */
const IconB = () => (
  <div style={{
    width: '100%', height: '100%',
    background: '#ffffff',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    border: '1px solid #dde3f5',
  }}>
    <span style={{
      fontFamily: "'DM Serif Display', serif",
      fontStyle: 'italic',
      fontSize: 120,
      color: '#1B4FD8',
      lineHeight: 1,
    }}>∫</span>
  </div>
);

/* ── C: App icon — blue pill ── */
const IconC = () => (
  <div style={{
    width: '100%', height: '100%',
    background: 'linear-gradient(145deg, #2a5ff5, #0f35c0)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    borderRadius: 40,
    boxShadow: '0 12px 40px rgba(27,79,216,0.5)',
  }}>
    <span style={{
      fontFamily: "'DM Serif Display', serif",
      fontStyle: 'italic',
      fontSize: 120,
      color: '#ffffff',
      lineHeight: 1,
    }}>∫</span>
  </div>
);

/* ── D: Playfair, heavier, light bg ── */
const IconD = () => (
  <div style={{
    width: '100%', height: '100%',
    background: '#f0f4ff',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
  }}>
    <span style={{
      fontFamily: "'Playfair Display', serif",
      fontStyle: 'italic',
      fontSize: 130,
      fontWeight: 700,
      color: '#1B4FD8',
      lineHeight: 1,
    }}>∫</span>
  </div>
);

function App() {
  return (
    <DesignCanvas title="Integral — Logo">
      <DCSection id="icon" title="∫ Symbol">
        <DCArtboard id="b" label="Integral" width={240} height={240}>
          <IconB />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
